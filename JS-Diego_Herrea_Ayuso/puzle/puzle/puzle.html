<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle de Imagen</title>
    <link rel="stylesheet" href="puzle.css">
</head>
<body>
    <main class="contenedor">
        <section class="panel">
            <h1>Puzzle de Imagen</h1>
            <button id="reiniciar" type="button">Mezclar otra vez</button>
        </section>

        <section class="referencia">
            <h2>Imagen original</h2>
            <img src="img/original.png" alt="Imagen original de referencia">
        </section>

        <section class="tablero-wrap">
            <h2>Tablero</h2>
            <div id="puzzle" class="puzzle"></div>
        </section>
    </main>

    <script src="puzle.js"></script>
</body>
</html>
